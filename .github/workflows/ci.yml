name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build
      - uses: actions/upload-artifact@v5
        with:
          name: tidings-forge
          path: forge/build/libs/*.jar

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: prettier
        run: pnpm exec prettier --check . '!public/**' '!dist/**'
      - name: eslint
        run: pnpm exec eslint .
      - name: tsc typecheck
        run: pnpm exec tsc -b --noEmit
      - name: tests
        run: pnpm test
      - name: build
        run: pnpm run build

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: relay/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: relay/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: prettier
        run: pnpm exec prettier --check .
      - name: tsc typecheck
        run: pnpm run typecheck
      - name: tests
        run: pnpm test
